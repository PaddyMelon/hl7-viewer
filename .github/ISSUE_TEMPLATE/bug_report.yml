name: Bug report
description: Something isn't working as expected
type: Bug
labels: ["bug","triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > **Never post real patient data.** Use synthetic or fully de-identified HL7 messages only.
        > Do not submit security vulnerabilities here. [Report privately](https://github.com/PaddyMelon/hl7-viewer/security/advisories/new).

  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the correct behavior.
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Make sure no real patient data is visible, including file names, tabs, and other open windows.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that reliably reproduces the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: Sample HL7 message (synthetic only)
      description: The smallest message that reproduces the problem.
      render: text

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Plugins, then find this plugin.
    validations:
      required: true

  - type: input
    id: ide
    attributes:
      label: IDE version and build
      description: Help → About.
      placeholder: "IntelliJ IDEA 2026.3, Build #IU-263.7307.200"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Help → Show Log in Explorer/Finder → idea.log. Paste only the relevant lines and check them for patient data first.
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: This issue contains no real patient data
          required: true
